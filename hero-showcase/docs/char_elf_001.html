<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Card</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;display:flex;justify-content:center;padding:24px;min-height:100vh}
.light body,.light{background:#F5F5F5;color:#212121}
.dark body,.dark{background:#121212;color:#E0E0E0}

.card{max-width:440px;width:100%;border-radius:16px;overflow:hidden;transition:background 0.3s,color 0.3s}
.light .card,.card.light-card{background:#fff;border:1px solid #E0E0E0;color:#212121}
.dark .card,.card.dark-card{background:#1E1E1E;border:1px solid #333;color:#E0E0E0}

/* 테마 토글 */
.tbtn{position:absolute;top:10px;right:10px;z-index:5;width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.light .tbtn{background:rgba(0,0,0,0.08)}
.dark .tbtn{background:rgba(255,255,255,0.12)}
.tbtn-sun,.tbtn-moon{width:18px;height:18px;display:none}
.light .tbtn-moon{display:block;stroke:#444;fill:none;stroke-width:2}
.dark .tbtn-sun{display:block;stroke:#ddd;fill:none;stroke-width:2}

/* 배너 */
.banner{position:relative;height:170px;overflow:hidden;cursor:pointer;transition:background 0.3s}
.light .banner{background:#F0F0F0}
.dark .banner{background:#2A2A2A}
.banner-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.3}
.dotp{position:absolute;inset:0}
.light .dotp{opacity:0.04}
.dark .dotp{opacity:0.05}
.bfade{position:absolute;bottom:0;left:0;right:0;height:70px}
.light .bfade{background:linear-gradient(transparent,rgba(255,255,255,0.92))}
.dark .bfade{background:linear-gradient(transparent,rgba(30,30,30,0.92))}
.binfo{position:absolute;bottom:10px;left:16px;right:54px;display:flex;align-items:flex-end;gap:12px}
.av{width:64px;height:64px;border-radius:50%;border:2.5px solid #F9A825;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;transition:background 0.3s}
.light .av{background:#EEEEEE}
.dark .av{background:#333}
.av img{width:100%;height:100%;object-fit:cover}
.av-icon{width:28px;height:28px;fill:none;stroke-width:1.5}
.light .av-icon{stroke:#9E9E9E}
.dark .av-icon{stroke:#666}

/* 이름, 칭호 */
.nm{font-size:17px;font-weight:500;line-height:1.2}
.light .nm{color:#212121}
.dark .nm{color:#F5F5F5}
.ttl{font-size:11px;margin-top:2px}
.light .ttl{color:#757575}
.dark .ttl{color:#999}

/* 레어리티 뱃지 */
.rr{font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;letter-spacing:0.3px}
.rc{color:#78909C;background:#ECEFF1;border:1px solid #CFD8DC}
.rra{color:#1565C0;background:#E3F2FD;border:1px solid #BBDEFB}
.rh{color:#7B1FA2;background:#F3E5F5;border:1px solid #CE93D8}
.rl{color:#E65100;background:#FFF3E0;border:1px solid #FFCC80}
.rm{color:#C62828;background:#FFEBEE;border:1px solid #EF9A9A}

/* 바디 */
.bd{padding:14px 16px}
.tgs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.tg{font-size:11px;padding:3px 10px;border-radius:20px;transition:all 0.3s}
.light .tg{background:#F5F5F5;color:#616161;border:1px solid #E0E0E0}
.dark .tg{background:#2A2A2A;color:#BDBDBD;border:1px solid #444}

/* 스탯 + 스킬 행 */
.srow{display:flex;gap:12px;margin-bottom:2px}
.scol{flex:0 0 152px}
.kcol{flex:1;min-width:0}
.lb{font-size:11px;font-weight:500;letter-spacing:0.4px;margin-bottom:6px}
.light .lb{color:#9E9E9E}
.dark .lb{color:#777}

/* 스킬 아이템 */
.si{margin-bottom:5px}
.sh{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px}
.light .sn{color:#616161}
.dark .sn{color:#BDBDBD}
.rs{font-weight:500}
.rss{color:#E65100}
.rsa{color:#7B1FA2}
.rsb{color:#1976D2}
.rsc{color:#9E9E9E}
.bbg{height:4px;border-radius:2px;overflow:hidden;transition:background 0.3s}
.light .bbg{background:#EEEEEE}
.dark .bbg{background:#333}
.bf{height:100%;border-radius:2px}

/* 구분선 */
.sp{border:none;margin:10px 0}
.light .sp{border-top:1px solid #F0F0F0}
.dark .sp{border-top:1px solid #333}

/* 무기 태그 */
.wr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.wt{font-size:11px;padding:4px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;font-weight:500}
.wm{background:#FFF3E0;color:#E65100;border:1px solid #FFCC80}
.wsub{background:#F3E5F5;color:#7B1FA2;border:1px solid #CE93D8}

/* 패시브 */
.pv{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin-bottom:5px;transition:all 0.3s}
.light .pv{background:#FAFAFA;border:1px solid #EEEEEE}
.dark .pv{background:#262626;border:1px solid #383838}
.pi{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pi svg{width:14px;height:14px}
.pn{font-size:12px;font-weight:500;margin-bottom:1px}
.light .pn{color:#333}
.dark .pn{color:#E0E0E0}
.pd{font-size:11px;line-height:1.5}
.light .pd{color:#616161}
.dark .pd{color:#AAA}

/* 아코디언 (로어) */
.lo{border-radius:10px;overflow:hidden;margin-bottom:8px}
.loh{padding:9px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;-webkit-user-select:none;user-select:none}
.lot{font-size:12px;font-weight:500}
.loc{width:14px;height:14px;transition:transform 0.2s}
.loc.open{transform:rotate(180deg)}
.locc{max-height:0;overflow:hidden;transition:max-height 0.35s ease}
.locc.open{max-height:1200px}
.loi{padding:0 12px 10px}
.lt{font-size:12px;line-height:1.7}
.light .lt{color:#424242}
.dark .lt{color:#BDBDBD}
.dr{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.light .dl{color:#9E9E9E}
.dark .dl{color:#777}
.light .dv{color:#424242}
.dark .dv{color:#BDBDBD}
.dv{text-align:right;max-width:62%}

/* 아코디언 색상 - 라이트 */
.la .loh{background:#FFF8E1}.la .lot,.la .loc{color:#E65100}.la .locc{background:#FFFDE7}
.lp .loh{background:#F3E5F5}.lp .lot,.lp .loc{color:#7B1FA2}.lp .locc{background:#FBF0FF}
.lr .loh{background:#FBE9E7}.lr .lot,.lr .loc{color:#BF360C}.lr .locc{background:#FFF3F0}
.ltt .loh{background:#E0F2F1}.ltt .lot,.ltt .loc{color:#00796B}.ltt .locc{background:#E8FAF8}
.lb2 .loh{background:#E3F2FD}.lb2 .lot,.lb2 .loc{color:#1565C0}.lb2 .locc{background:#EDF5FF}

/* 아코디언 색상 - 다크 */
.dark .la .loh{background:#3E2D10}.dark .la .lot,.dark .la .loc{color:#FFB300}.dark .la .locc{background:#332510}
.dark .lp .loh{background:#2D1840}.dark .lp .lot,.dark .lp .loc{color:#CE93D8}.dark .lp .locc{background:#291535}
.dark .lr .loh{background:#3B1510}.dark .lr .lot,.dark .lr .loc{color:#FF8A65}.dark .lr .locc{background:#2E110C}
.dark .ltt .loh{background:#0D2D2A}.dark .ltt .lot,.dark .ltt .loc{color:#4DB6AC}.dark .ltt .locc{background:#0A2622}
.dark .lb2 .loh{background:#0D253D}.dark .lb2 .lot,.dark .lb2 .loc{color:#64B5F6}.dark .lb2 .locc{background:#0A1E33}

/* 명대사 */
.qt{font-size:12px;font-style:italic;text-align:center;line-height:1.5;padding:6px 0}
.light .qt{color:#757575}
.dark .qt{color:#999}

/* 이미지 선택 오버레이 */
.isel{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.82);z-index:10;padding:12px;flex-direction:column;gap:6px;border-radius:16px 16px 0 0}
.isel.show{display:flex}
.iselt{font-size:12px;color:rgba(255,255,255,0.65);text-align:center}
.igr{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.iopt{border-radius:10px;cursor:pointer;border:2px solid transparent;background:rgba(255,255,255,0.06);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,0.3);transition:border-color 0.15s;overflow:hidden}
.iopt:hover{border-color:#F9A825}
.iopt.sel{border-color:#F9A825}
.iopt img{width:100%;height:100%;object-fit:cover}

/* 라이트박스 */
.lightbox{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;cursor:pointer;border-radius:0}
.lightbox.show{display:flex}
.lightbox img{max-width:95%;max-height:95%;border-radius:8px;object-fit:contain;box-shadow:0 4px 40px rgba(0,0,0,0.5)}
</style>
</head>
<body class="light">

<div class="card" id="card">
  <div class="banner" id="banner" onclick="handleBannerClick()">
    <div class="banner-bg" id="bannerBg"></div>
    <button class="tbtn" onclick="event.stopPropagation();toggleTheme()">
      <svg class="tbtn-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
      <svg class="tbtn-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2m-9-11h2m18 0h2m-3.3-6.7l-1.4 1.4M6.7 17.3l-1.4 1.4m0-12l1.4 1.4m10.6 10.6l1.4 1.4"/></svg>
    </button>
    <svg class="dotp" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><pattern id="d" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1" fill="currentColor"/></pattern><rect width="100%" height="100%" fill="url(#d)"/></svg>

    <div class="isel" id="imgSel">
      <div class="iselt">4개의 이미지 중 하나를 선택하세요</div>
      <div class="igr" id="imgGrid"></div>
    </div>

    <div class="lightbox" id="lightbox" onclick="event.stopPropagation();closeLightbox()"></div>

    <div class="bfade"></div>
    <div class="binfo">
      <div class="av" id="avatarEl"></div>
      <div style="flex:1;min-width:0">
        <div style="margin-bottom:2px"><span class="rr" id="rarityBadge"></span></div>
        <p class="nm" id="charName"></p>
        <p class="ttl" id="charTitle"></p>
      </div>
    </div>
  </div>

  <div class="bd">
    <div class="tgs" id="tagsEl"></div>

    <div class="srow">
      <div class="scol">
        <div class="lb">STATS</div>
        <div style="position:relative;width:148px;height:148px"><canvas id="rc" width="148" height="148"></canvas></div>
      </div>
      <div class="kcol">
        <div class="lb">SKILLS</div>
        <div id="skillsEl"></div>
      </div>
    </div>

    <hr class="sp">
    <div class="lb">WEAPON</div>
    <div class="wr" id="weaponsEl"></div>

    <hr class="sp">
    <div class="lb">PASSIVE</div>
    <div id="passivesEl"></div>

    <hr class="sp">
    <div id="loreEl"></div>

    <div style="padding-top:8px;margin-top:4px">
      <div class="qt" id="quoteEl"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// ===== 캐릭터 데이터 (이 부분을 실제 데이터로 교체) =====
const CHARACTER_DATA = {"id": "char_elf_001", "name": "릴리안 윈드러너", "title": "웃음 속에 칼날을 감춘 바람의 검무사", "race": "하이엘프", "age": "127세", "job": "쌍검사", "alignment": "혼돈 선", "rarity": "hero", "stats": {"STR": 6, "INT": 5, "DEX": 10, "CON": 5, "WIS": 4, "CHA": 9}, "skills": [{"name": "질풍 쌍검술", "rank": "S", "percent": 94}, {"name": "바람걸음", "rank": "A", "percent": 85}, {"name": "허점 간파", "rank": "A", "percent": 79}, {"name": "즉흥 요리", "rank": "B", "percent": 55}, {"name": "도발 화술", "rank": "B", "percent": 62}], "weapons": [{"name": "여명 — 새벽빛 미스릴 곡검", "type": "main"}, {"name": "석양 — 황혼빛 미스릴 곡검", "type": "sub"}], "passives": [{"name": "바람이 부는 방향", "description": "회피 성공 시 다음 공격의 치명타 확률 30% 증가. 연속 회피 시 중첩.", "color": "teal"}, {"name": "끊이지 않는 수다", "description": "전투 중 말을 걸면 적의 집중력 10% 감소. 파티원 사기 20% 증가.", "color": "amber"}, {"name": "살인 요리", "description": "직접 만든 요리를 먹은 대상은 50% 확률로 중독, 50% 확률로 HP 전회복. 본인은 면역.", "color": "red"}], "lore": {"backstory": "릴리안은 엘프 왕국 '아르넬라스'의 명문 검술 가문에서 태어났다. 어릴 적부터 천재라 불렸지만, 본인은 '검술보다 시장이 더 재밌다'며 수련을 빠지기 일쑤였다. 가문의 엄격한 아버지와 매일 충돌했고, 결국 17세(엘프 기준 어린이)에 가출하여 인간 세계의 용병단에 합류했다.\n\n용병단에서 릴리안은 자신의 검술이 실전에서 얼마나 통하는지 깨달았다. 동시에 인간들의 짧고 뜨거운 삶에 매료되었다. 전투 전 두려움에 떠는 동료에게 농담을 던져 웃기고, 전투 후엔 직접 만든(치명적인) 스튜를 끓여주는 것이 일상이 되었다. 용병단장 '검은 곰' 고르든은 릴리안의 요리를 먹고 3일간 쓰러졌다가, 회복 후 '전쟁터보다 네 부엌이 더 무섭다'고 선언했다.\n\n현재 릴리안은 독립 모험가로 활동하며, 대륙 곳곳의 맛집을 찾아다니고 있다. 싸움은 생계 수단이고, 진짜 목표는 '모든 종족이 인정하는 레시피북 완성'이다. 가문과의 관계는 아직 서먹하지만, 매년 아버지의 생일에 편지 한 통은 보낸다 — 요리 레시피와 함께.", "personality": [{"label": "성격", "value": "수다스럽고 낙천적. 침묵이 3초 이상 지속되면 불안해함"}, {"label": "가치관", "value": "오늘 웃지 못하면 내일은 없다"}, {"label": "두려움", "value": "혼자 조용한 식탁에 앉는 것"}, {"label": "목표", "value": "모든 종족이 인정하는 레시피북 완성"}, {"label": "약점", "value": "칭찬에 극도로 약하다 — 적이 칭찬하면 공격을 멈춤"}], "specialty": [{"label": "전투 스타일", "value": "쌍검 연무 — 춤추듯 회전하며 베는 유려한 검술"}, {"label": "시그니처 기술", "value": "질풍 16연참 (말하면서 친다)"}, {"label": "비전투 특기", "value": "요리 (맛은 극단적, 독과 약 사이)"}, {"label": "취미", "value": "각 도시 맛집 탐방, 레시피 수집"}, {"label": "의외의 재능", "value": "동물 조련   rare: { text: '희귀', cls: 'rra' },
  hero: { text: '영웅', cls: 'rh' },
  legendary: { text: '전설', cls: 'rl' },
  mythic: { text: '신화', cls: 'rm' }
};

// 스킬 랭크 색상
const rankColor = { S: '#F9A825', A: '#AB47BC', B: '#1976D2', C: '#9E9E9E' };
const rankClass = { S: 'rss', A: 'rsa', B: 'rsb', C: 'rsc' };

// 패시브 아이콘 색상
const passiveColors = {
  amber: { bg: '#FFF3E0', stroke: '#E65100' },
  purple: { bg: '#F3E5F5', stroke: '#7B1FA2' },
  blue: { bg: '#E3F2FD', stroke: '#1565C0' },
  teal: { bg: '#E0F2F1', stroke: '#00796B' },
  red: { bg: '#FFEBEE', stroke: '#C62828' }
};

// 패시브 SVG 아이콘 (로테이션)
const passiveIcons = [
  '<svg viewBox="0 0 24 24" fill="none" stroke="__COLOR__" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2m-9-11h2m18 0h2m-3.3-6.7l-1.4 1.4M6.7 17.3l-1.4 1.4m0-12l1.4 1.4m10.6 10.6l1.4 1.4"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="__COLOR__" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="__COLOR__" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none" stroke="__COLOR__" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>'
];

// 무기 SVG 아이콘
const weaponIcons = {
  main: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 3.5L20.5 9.5M6 22L2 18l13-13 4 4-13 13z"/></svg>',
  sub: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4m-9-11h4m10 0h4"/></svg>'
};

// 아코디언 섹션 정의
const loreSections = [
  { key: 'backstory', title: '배경 스토리', cls: 'la', type: 'text' },
  { key: 'personality', title: '성격 / 가치관', cls: 'lp', type: 'pairs' },
  { key: 'specialty', title: '특기 / 취미', cls: 'lr', type: 'pairs' },
  { key: 'tmi', title: 'TMI', cls: 'ltt', type: 'pairs' },
  { key: 'relations', title: '인물 관계', cls: 'lb2', type: 'pairs' }
];

const chevronSvg = '<svg class="loc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';

function renderCard() {
  const d = CHARACTER_DATA;

  // 레어리티
  const r = rarityMap[d.rarity] || rarityMap.common;
  const badge = document.getElementById('rarityBadge');
  badge.textContent = r.text;
  badge.className = 'rr ' + r.cls;

  // 이름, 칭호
  document.getElementById('charName').textContent = d.name;
  document.getElementById('charTitle').textContent = d.title;

  // 아바타
  const avEl = document.getElementById('avatarEl');
  if (SELECTED_IMAGE >= 0 && CHARACTER_IMAGES[SELECTED_IMAGE]) {
    avEl.innerHTML = '<img src="' + CHARACTER_IMAGES[SELECTED_IMAGE] + '" alt="avatar">';
    document.getElementById('bannerBg').style.backgroundImage = 'url(' + CHARACTER_IMAGES[SELECTED_IMAGE] + ')';
  } else {
    avEl.innerHTML = '<svg class="av-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>';
  }

  // 태그
  const tags = [d.race, d.age, d.job, d.alignment].filter(Boolean);
  document.getElementById('tagsEl').innerHTML = tags.map(t => '<span class="tg">' + t + '</span>').join('');

  // 스킬
  document.getElementById('skillsEl').innerHTML = d.skills.map(s => {
    const rc = rankClass[s.rank] || 'rsc';
    const clr = rankColor[s.rank] || '#9E9E9E';
    return '<div class="si"><div class="sh"><span class="sn">' + s.name + '</span><span class="rs ' + rc + '">' + s.rank + '</span></div><div class="bbg"><div class="bf" style="width:' + s.percent + '%;background:' + clr + '"></div></div></div>';
  }).join('');

  // 무기
  document.getElementById('weaponsEl').innerHTML = d.weapons.map(w => {
    const cls = w.type === 'main' ? 'wm' : 'wsub';
    const icon = weaponIcons[w.type] || weaponIcons.sub;
    return '<span class="wt ' + cls + '">' + icon + w.name + '</span>';
  }).join('');

  // 패시브
  document.getElementById('passivesEl').innerHTML = d.passives.map((p, i) => {
    const c = passiveColors[p.color] || passiveColors.amber;
    const iconHtml = passiveIcons[i % passiveIcons.length].replace(/__COLOR__/g, c.stroke);
    return '<div class="pv"><div class="pi" style="background:' + c.bg + '">' + iconHtml + '</div><div><div class="pn">' + p.name + '</div><div class="pd">' + p.description + '</div></div></div>';
  }).join('');

  // 아코디언 (로어)
  document.getElementById('loreEl').innerHTML = loreSections.map((sec, idx) => {
    const data = d.lore[sec.key];
    if (!data) return '';
    let content = '';
    if (sec.type === 'text') {
      content = '<div class="lt">' + data.replace(/\n/g, '<br>') + '</div>';
    } else {
      content = data.map(item => '<div class="dr"><span class="dl">' + item.label + '</span><span class="dv">' + item.value + '</span></div>').join('');
    }
    return '<div class="lo ' + sec.cls + '" id="lo' + idx + '"><div class="loh" onclick="tgl(\'lo' + idx + '\')"><span class="lot">' + sec.title + '</span>' + chevronSvg + '</div><div class="locc"><div class="loi">' + content + '</div></div></div>';
  }).join('');

  // 명대사
  document.getElementById('quoteEl').textContent = '"' + d.quote + '"';

  // 이미지 그리드
  if (CHARACTER_IMAGES.length > 0) {
    document.getElementById('imgGrid').innerHTML = CHARACTER_IMAGES.map((img, i) => {
      const selCls = i === SELECTED_IMAGE ? ' sel' : '';
      return '<div class="iopt' + selCls + '" onclick="pickImg(event,' + i + ')"><img src="' + img + '" alt="후보 ' + (i+1) + '"></div>';
    }).join('');
  } else {
    document.getElementById('imgGrid').innerHTML = [0,1,2,3].map(i => {
      const selCls = i === 0 ? ' sel' : '';
      return '<div class="iopt' + selCls + '" onclick="pickImg(event,' + i + ')">후보 ' + (i+1) + '</div>';
    }).join('');
  }

  // 레이더 차트
  renderChart();
}

function renderChart() {
  const d = CHARACTER_DATA;
  const gc = dk ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
  const lc = dk ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.5)';
  const bg = dk ? 'rgba(249,168,37,0.18)' : 'rgba(249,168,37,0.12)';
  if (chart) chart.destroy();
  const labels = Object.keys(d.stats);
  const data = Object.values(d.stats);
  chart = new Chart(document.getElementById('rc'), {
    type: 'radar',
    data: { labels: labels, datasets: [{ data: data, backgroundColor: bg, borderColor: '#F9A825', borderWidth: 1.5, pointBackgroundColor: '#F9A825', pointRadius: 2.5, pointHoverRadius: 4 }] },
    options: {
      responsive: true, maintainAspectRatio: true,
      animation: { duration: 250 },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.label + ': ' + c.raw + '/10' } } },
      scales: { r: { beginAtZero: true, min: 0, max: 10, ticks: { stepSize: 2, display: false }, grid: { color: gc }, angleLines: { color: gc }, pointLabels: { font: { size: 9, weight: '500' }, color: lc } } }
    }
  });
}

function toggleTheme() {
  dk = !dk;
  document.body.classList.toggle('light', !dk);
  document.body.classList.toggle('dark', dk);
  renderChart();
}

function tgl(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.querySelector('.locc').classList.toggle('open');
  el.querySelector('.loc').classList.toggle('open');
}

let selOpen = false;
function handleBannerClick() {
  if (document.getElementById('lightbox').classList.contains('show')) return;
  if (SELECTED_IMAGE >= 0 && CHARACTER_IMAGES[SELECTED_IMAGE] && !selOpen) {
    openLightbox();
    return;
  }
  selOpen = !selOpen;
  document.getElementById('imgSel').classList.toggle('show', selOpen);
}

function pickImg(e, n) {
  e.stopPropagation();
  document.querySelectorAll('.iopt').forEach(o => o.classList.remove('sel'));
  e.currentTarget.classList.add('sel');
  selOpen = false;
  document.getElementById('imgSel').classList.remove('show');
}

function openLightbox() {
  const lb = document.getElementById('lightbox');
  if (SELECTED_IMAGE >= 0 && CHARACTER_IMAGES[SELECTED_IMAGE]) {
    lb.innerHTML = '<img src="' + CHARACTER_IMAGES[SELECTED_IMAGE] + '" alt="character">';
  }
  document.body.appendChild(lb);
  lb.classList.add('show');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

// 초기 렌더링
renderCard();
</script>
</body>
</html>
