<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Share</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <span class="logo">📄</span>
      <h1>Page Share</h1>
    </header>

    <div id="status" class="status idle">
      <p id="status-text">현재 페이지를 저장합니다</p>
    </div>

    <button id="save-btn" class="btn-primary">
      💾 Save Page
    </button>

    <div id="result" class="result hidden">
      <p class="result-label">공유 URL</p>
      <div class="url-row">
        <input id="share-url" type="text" readonly />
        <button id="copy-btn" class="btn-copy">복사</button>
      </div>
    </div>

    <div class="settings-row">
      <label for="api-base">API URL</label>
      <input id="api-base" type="text" placeholder="http://localhost:52741" />
    </div>
    <div class="settings-row">
      <label for="api-key">API Key</label>
      <input id="api-key" type="password" placeholder="없으면 빈칸" />
    </div>

    <details id="r2-section">
      <summary>R2 직접 업로드 설정</summary>
      <div class="r2-fields">
        <div class="settings-row">
          <label for="r2-endpoint">Endpoint</label>
          <input id="r2-endpoint" type="text" placeholder="https://ACCOUNT.r2.cloudflarestorage.com" />
        </div>
        <div class="settings-row">
          <label for="r2-bucket">Bucket</label>
          <input id="r2-bucket" type="text" placeholder="page-share" />
        </div>
        <div class="settings-row">
          <label for="r2-key-id">Key ID</label>
          <input id="r2-key-id" type="text" />
        </div>
        <div class="settings-row">
          <label for="r2-secret">Secret</label>
          <input id="r2-secret" type="password" />
        </div>
        <div class="settings-row">
          <label for="r2-public-url">Public URL</label>
          <input id="r2-public-url" type="text" placeholder="https://pub-xxx.r2.dev" />
        </div>
      </div>
    </details>

    <button id="save-settings-btn" class="btn-small">설정 저장</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
